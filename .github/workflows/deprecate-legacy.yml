name: Deprecate legacy mr-wolf

# Одноразовый workflow (после запуска удаляется): deprecate легаси-пакета
# mr-wolf@0.1.1 — старое имя до переименования проекта в mister-wolf.
# Auth — тот же механизм, что в publish.yml: npm trusted publishing (OIDC),
# долгоживящих токенов в репо нет.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  deprecate:
    name: npm deprecate mr-wolf@*
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11

      - name: Deprecate mr-wolf@*
        run: 'npm deprecate "mr-wolf@*" "Renamed! This legacy package (0.1.1) is unmaintained. Install ''mister-wolf'' instead: npm i -g mister-wolf"'
