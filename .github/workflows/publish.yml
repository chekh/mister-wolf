name: Publish

# Тег-триггер не срабатывает из форков: push тега требует write-доступа к репо.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release page (notes from CHANGELOG)
  id-token: write # npm trusted publishing (OIDC) + provenance; долгоживущих токенов нет

jobs:
  publish:
    name: npm publish (trusted publishing)
    runs-on: ubuntu-latest
    # GitHub Environment с protection (required reviewers) — дополнительный контур;
    # настроить в репо-настройках один раз: Environment "npm" + linked publishing в npm.
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Sanity — tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Checks
        run: npm run check

      - name: 'E2E (publishable artifact — правило проекта: E2E после каждого плана)'
        run: npm run e2e

      - name: Pack dry-run (tarball audit log in CI output)
        run: npm pack --dry-run

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11

      - name: Publish (OIDC + provenance)
        run: npm publish --provenance

      - name: GitHub Release (notes from CHANGELOG)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.VERSION;
            const version = tag.replace(/^v/, '');
            const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
            const start = lines.findIndex((l) => l.startsWith('## [' + version + ']'));
            if (start === -1) { console.error('CHANGELOG has no section for ' + version); process.exit(1); }
            let end = lines.length;
            for (let i = start + 1; i < lines.length; i++) {
              if (lines[i].startsWith('## [')) { end = i; break; }
            }
            const body = lines.slice(start + 1, end).join('\n').trim();
            if (body.length === 0) { console.error('CHANGELOG section for ' + version + ' is empty'); process.exit(1); }
            fs.writeFileSync('release-notes.md', body + '\n');
          "
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
