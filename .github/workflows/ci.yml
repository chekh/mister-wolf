name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  node:
    name: Node.js ${{ matrix.node-version }} (${{ matrix.os }}) checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (proves better-sqlite3 prebuilds for this Node/OS)
        run: npm ci

      - name: Run checks
        run: npm run check

  docker:
    name: Docker checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t mister-wolf:test .

      - name: Run checks in Docker
        run: docker run --rm mister-wolf:test
