name: Feature request
description: Suggest an idea or improvement for mister-wolf
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or need you are facing, not just the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should mister-wolf do to solve the problem?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other workarounds, existing tools, or approaches you have tried or ruled out.
    validations:
      required: false
